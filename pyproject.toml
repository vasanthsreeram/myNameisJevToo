[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myNameisJevToo"
version = "0.1.0"
description = "Convert any causal language model into a Jev-style (System One) decision model. No retraining, no new weights."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["jev", "system-one", "decision-model", "logits", "mlx", "apple-silicon", "calibration"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core package is stdlib-only. The MLX backend is optional so the readout
# logic stays inspectable on any machine.
[project.optional-dependencies]
mlx = ["mlx>=0.25", "mlx-lm>=0.25"]

[tool.setuptools.packages.find]
include = ["jevtoo*"]
