[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myNameisJevToo"
version = "0.2.0"
description = "Serve any causal language model at POST /v1/systemone. No retraining, no new weights."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["jev", "system-one", "decision-model", "logits", "mlx", "apple-silicon", "calibration"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
jevtoo = "jevtoo.serve:main"

# Core package is stdlib-only. The MLX backend is optional so the readout
# logic stays inspectable on any machine.
[project.optional-dependencies]
mlx = ["mlx>=0.25", "mlx-lm>=0.25"]

[tool.setuptools.packages.find]
include = ["jevtoo*"]
